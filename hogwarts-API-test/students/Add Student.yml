info:
  name: Add Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/students"
  body:
    type: json
    data: |-
      {
        "first_name": "Peter",
        "last_name": "Lind",
        "role": "Teacher"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
