info:
  name: Add Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/:dataTable"
  params:
    - name: dataTable
      value: students
      type: path
  body:
    type: json
    data: |-
      {
        "first_name": "Peter",
        "last_name": "Lind",
        "house": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
