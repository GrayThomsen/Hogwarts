info:
  name: Get Subject by Name
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/:dataTable/name/:name"
  params:
    - name: name
      value: Transfiguration
      type: path
    - name: dataTable
      value: classes
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
