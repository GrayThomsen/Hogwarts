info:
  name: Add Staff
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/:dataTable"
  params:
    - name: dataTable
      value: staff
      type: path
  body:
    type: json
    data: |-
      {
        "first_name": "Emil",
        "last_name": "Thomsen",
        "role": "Teacher's Assistant",
        "house": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
